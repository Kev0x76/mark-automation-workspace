[project]
name = "mark-generator"
version = "0.1.0"
description = "Local shipping-mark generation workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "openpyxl>=3.1",
  "xlrd==2.0.2",
  "olefile==0.47",
  "python-multipart>=0.0.9",
  "pytest>=8.0",
  "jsonschema>=4.23",
  "openai>=2.24",
  "Pillow>=12.0",
  "numpy>=1.26",
  "opencv-contrib-python>=4.10",
  "rapidocr-onnxruntime==1.4.4",
  "PyMuPDF>=1.25",
  "reportlab>=5.0",
  "python-barcode>=0.16",
  "zxing-cpp==2.2.0",
  "httpx>=0.27",
  "httpx2>=2.7",
  "fonttools>=4.55",
  "rapidfuzz==3.9.0",
  "pytesseract==0.3.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "visual: tests that use real workspace images or perform expensive visual processing",
  "contract: file-schema and HTTP boundary tests",
]
